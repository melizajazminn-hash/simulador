<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
    <!-- SE DETUVO LA CARGA DESDE AQUÍ ARRIBA -->
</head>
<body>

  <div class="card-simulador">
 </div>

  <script src="funciones.js"></script> 
  <script src="simulador.js"></script> 
</body>
</html>
  <div class="card-simulador">
    
    <!-- Cabecera con Logo y Título -->
    <header class="cabecera-simulador">
      <img src="bbva" alt="BBVA Logo" class="logo-bbva-flotante">
      <h1 class="titulo-centrado">Simulador de Crédito</h1>
    </header>
 <!-- 3. SECCIÓN: DATOS FINANCIEROS -->
    <section>
      <h2 class="subtitulo-seccion">Datos financieros</h2>
      
      <label for="ingresos">Ingresos:</label>
      <input type="number" id="ingresos">
      
      <label for="egresos">Egresos:</label>
      <input type="number" id="egresos">
      
      <p class="resultado-linea">Disponible: <span id="res-disponible">$0.00</span></p>
      <p class="resultado-linea">Capacidad de pago mensual: <span id="res-capacidad">$0.00</span></p>
    </section>

    <!-- SECCIÓN: SOLICITUD DE CRÉDITO -->
    <section>
      <h2 class="subtitulo-seccion">Solicitud de crédito</h2>
      
      <label for="monto">Monto:</label>
      <input type="number" id="monto">
      
      <label for="plazo">Plazo en años:</label>
      <input type="number" id="plazo">
      
      <label for="tasa">Tasa de interés:</label>
      <input type="number" id="tasa" step="0.1">
      
      <p class="resultado-linea">Interés a pagar: <span id="res-interes">$0.00</span></p>
      <p class="resultado-linea">Total préstamo: <span id="res-total">$0.00</span></p>
      <p class="resultado-linea">Cuota mensual: <span id="res-cuota">$0.00</span></p>
      
      <p class="resultado-linea">Estado de crédito: <span id="res-estado" class="estado-analizando">ANALIZANDO...</span></p>
    </section>

    <!-- Botones de Acción -->
    <div class="botones-contenedor">
      <button type="button" id="btn-calcular" class="btn-calcular">Calcular Crédito</button>
      <button type="button" id="btn-reiniciar" class="btn-reiniciar">Reiniciar</button>
    </div>

  </div>

</body>
</html>
